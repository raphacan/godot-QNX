name: Build godot-cpp
description: Build godot-cpp with the provided options.

inputs:
  bin:
    description: Path to the Godot binary.
    required: true
    type: string
  scons-flags:
    description: Additional SCons flags.
    type: string
  scons-cache:
    description: The SCons cache path.
    default: ${{ github.workspace }}/.scons_cache/
    type: string
  godot-cpp-branch:
    description: The godot-cpp branch.
    default: master
    type: string

runs:
  using: composite
  steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        repository: godotengine/godot-cpp
        ref: ${{ inputs.godot-cpp-branch }}
        path: godot-cpp

    - name: Extract API
      shell: sh
      run: ${{ inputs.bin }} --headless --dump-gdextension-interface --dump-extension-api

    - name: Set up ar wrapper for long argument lists
      shell: bash
      run: |
        sudo tee /usr/local/bin/ar-wrapper > /dev/null << 'ARWRAPPER'
        #!/bin/bash
        # Use batched ar append + ranlib when the argument list would be too long.
        if [[ "${1}" == r* ]] && (( $# > 400 )); then
          target="$2"; shift 2
          /usr/bin/ar rc "$target"
          printf '%s\n' "$@" | xargs -n 200 /usr/bin/ar rq "$target"
          ranlib "$target"
        else
          exec /usr/bin/ar "$@"
        fi
        ARWRAPPER
        sudo chmod +x /usr/local/bin/ar-wrapper
        sudo ln -sf /usr/local/bin/ar-wrapper /usr/bin/ar

    - name: SCons Build
      shell: sh
      env:
        SCONS_CACHE: ${{ inputs.scons-cache }}
      run: scons --directory=./godot-cpp/test "gdextension_dir=${{ github.workspace }}" ${{ inputs.scons-flags }}
